<section class="reservas-page">
    <div class="encabezado">
        <h2>Mis reservas</h2>
        <p>Consulta y administra tus reservas activas y programadas.</p>
    </div>

    <p *ngIf="loading" class="text-gray-600">Cargando registros...</p>
    <p *ngIf="error" class="text-red-700">{{ error }}</p>

    <div class="lista-reservas">
        <article *ngFor="let item of items" class="reserva-card">
            <div class="info">
                <h3>{{ item.title }}</h3>
                <p>{{ item.details }}</p>
            </div>

            <div class="acciones">
                <span class="estado" [ngClass]="item.status">{{ item.status }}</span>
                <button *ngIf="item.type === 'reserva' && item.status === 'activa'" class="btn-primario"
                    (click)="markAttendance(item)">
                    Marcar Asistencia
                </button>
                <button *ngIf="item.status === 'pendiente' || item.status === 'activa'" class="btn-peligro"
                    (click)="cancel(item)">
                    Cancelar
                </button>
            </div>
        </article>

        <p *ngIf="!loading && items.length === 0" class="text-gray-600">Aún no tienes solicitudes o reservas.</p>
    </div>
</section>
